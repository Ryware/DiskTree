name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and coverage
    runs-on: macos-latest
    permissions:
      contents: write          # only used on main, to update the badges branch
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Run tests with coverage
        run: swift test --enable-code-coverage 2>&1 | tee test.log

      - name: Summarise results and build badge data
        run: python3 scripts/ci-summary.py test.log "$(swift test --show-codecov-path)" badges-out

      - name: Upload test log and badge data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test.log
            badges-out/

      - name: Publish badges (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/badges && mkdir /tmp/badges
          cp badges-out/*.json /tmp/badges/
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges && git checkout -B badges origin/badges
          else
            git checkout --orphan badges && git rm -rf . >/dev/null
          fi
          cp /tmp/badges/*.json .
          git add *.json
          git diff --cached --quiet || { git commit -m "Update badges for ${GITHUB_SHA::7}" && git push origin badges; }

  build:
    name: Release build
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build Headroom (release)
        run: swift build --configuration release
